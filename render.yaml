databases:
  - name: chopsmo-db
    databaseName: chopsmo_db
    user: chopsmo_user
    plan: free

services:
  - type: web
    name: chopsmo-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: daphne meal_project.asgi:application --port $PORT --bind 0.0.0.0
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: chopsmo-backend.onrender.com,*.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontendsmo.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://frontendsmo.vercel.app
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: optional
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: SESSION_COOKIE_SECURE
        value: True
      - key: CSRF_COOKIE_SECURE
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: chopsmo-db
          property: connectionString
